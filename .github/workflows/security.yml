name: Security Scan

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Run weekly on Sundays at midnight
    - cron: '0 0 * * 0'

jobs:
  audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend audit
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  # CodeQL analysis is handled by GitHub's default code scanning setup
  # (Settings > Code security > Code scanning), not this advanced workflow.
  # The advanced-workflow upload step was failing with "Code scanning is not
  # enabled for this repository" because code scanning had never been turned
  # on for this repo; default setup covers the same analysis without needing
  # a job here.

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
