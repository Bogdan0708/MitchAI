name: Security Scan

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Run weekly on Sundays at midnight
    - cron: '0 0 * * 0'

jobs:
  audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      # Blocking: production dependencies only. A high/critical finding here
      # fails the workflow — this is the enforced gate.
      - name: Run backend audit (production deps, blocking)
        run: npm audit --audit-level=high --omit=dev

      # Informational only: includes devDependencies and moderate findings,
      # surfaced for visibility but never fails the build.
      - name: Run backend audit (full tree, informational)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Blocking: production dependencies only. A high/critical finding here
      # fails the workflow — this is the enforced gate.
      - name: Run frontend audit (production deps, blocking)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      # Informational only: includes devDependencies and moderate findings,
      # surfaced for visibility but never fails the build.
      - name: Run frontend audit (full tree, informational)
        working-directory: frontend
        run: npm audit --audit-level=moderate
        continue-on-error: true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      # This step uploads SARIF results to GitHub code scanning. As of the
      # last check (2026-09-11) the repository's code scanning was reported
      # as `state: "not-configured"` via
      # `gh api repos/Bogdan0708/MitchAI/code-scanning/default-setup`, and an
      # advanced-workflow upload can fail with:
      #   "Code scanning is not enabled for this repository"
      # if code scanning has not been turned on under
      # Settings > Code security > Code scanning. continue-on-error is set
      # so the analysis still runs (and uploads once enabled) without
      # blocking other jobs; enabling code scanning for this repo is an
      # owner action, not something fixable from a workflow file.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
